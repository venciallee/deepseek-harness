<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t3 d3">
  <title id="t3">L1：子 Agent 与多 Agent 的拓扑</title>
  <desc id="d3">模型侧的 subagent 工具只拿回一个子 id；子 agent 跑完后由管理器把结果作为一条通知放回父 agent 的收件箱。provider 只回答孩子从哪来：spawn 交出空 seed，fork 交出父日志截到最后一个 turn/end 的前缀，外部产品交出一次性 run。Workflow、Ralph 用 caller 方式直接等待结果，Agent Team 把成员建成可续聊的子 agent。</desc>
  <style>
    .t{font:600 13px -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2328}
    .s{font:11.5px -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#57606a}
    .e{font:11.5px -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#424a53}
    .hub{fill:#e0e7ff;stroke:#3730a3;stroke-width:2.5}
    .proc{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
    .orch{fill:#fefce8;stroke:#a16207;stroke-width:1.4}
    .store{fill:#ecfdf5;stroke:#047857;stroke-width:1.6}
    .ext{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    .bound{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:6 4}
    .edge{fill:none;stroke:#57606a;stroke-width:1.5}
    .back{fill:none;stroke:#047857;stroke-width:1.6;stroke-dasharray:5 4}
    .ah{fill:#57606a}.ahb{fill:#047857}
    @media (prefers-color-scheme: dark){
      .t{fill:#e6edf3}.s,.e{fill:#9da7b3}
      .hub{fill:#272f5c;stroke:#a5b4fc}.proc{fill:#1e2448;stroke:#818cf8}
      .orch{fill:#2b230c;stroke:#eab308}.store{fill:#0f2a22;stroke:#34d399}
      .ext{fill:#161b22;stroke:#8b949e}.bound{stroke:#6e7681}
      .edge{stroke:#9da7b3}.back{stroke:#34d399}.ah{fill:#9da7b3}.ahb{fill:#34d399}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- orchestrators (caller delivery) -->
  <rect class="orch" x="250" y="30" width="150" height="58" rx="4"/>
  <text class="t" x="325" y="54" text-anchor="middle">Workflow 脚本</text>
  <text class="s" x="325" y="73" text-anchor="middle">模型写的 JS 扇出</text>
  <rect class="orch" x="420" y="30" width="150" height="58" rx="4"/>
  <text class="t" x="495" y="54" text-anchor="middle">Ralph 循环</text>
  <text class="s" x="495" y="73" text-anchor="middle">每轮全新子 agent</text>
  <path class="edge" d="M325,88 V196" marker-end="url(#a)"/>
  <path class="edge" d="M495,88 V196" marker-end="url(#a)"/>
  <text class="e" x="334" y="130">delivery: caller</text>
  <text class="e" x="334" y="147">直接等待结果</text>

  <!-- parent -->
  <rect class="hub" x="20" y="200" width="180" height="116" rx="10"/>
  <text class="t" x="110" y="232" text-anchor="middle">父 Agent</text>
  <text class="s" x="110" y="254" text-anchor="middle">subagent · subagent_fork</text>
  <text class="s" x="110" y="272" text-anchor="middle">send_message</text>
  <text class="s" x="110" y="290" text-anchor="middle">（只限直接父子）</text>

  <!-- manager -->
  <rect class="proc" x="300" y="200" width="230" height="116" rx="4"/>
  <text class="t" x="415" y="226" text-anchor="middle">子 Agent 管理器</text>
  <text class="s" x="415" y="248" text-anchor="middle">身份预留 · 容量 8 · 深度 1</text>
  <text class="s" x="415" y="266" text-anchor="middle">满了直接拒绝，不排队</text>
  <text class="s" x="415" y="284" text-anchor="middle">冷恢复 · 先子后父销毁</text>
  <text class="s" x="415" y="302" text-anchor="middle">结算后发通知</text>

  <path class="edge" d="M200,232 H296" marker-end="url(#a)"/>
  <text class="e" x="204" y="196">① 工具调用</text>
  <text class="e" x="204" y="213">立即返回子 id</text>
  <path class="back" d="M296,290 H204" marker-end="url(#b)"/>
  <text class="e" x="204" y="334">③ 结算通知</text>
  <text class="e" x="204" y="351">父空闲 queue / 忙 steer</text>

  <!-- providers -->
  <rect class="proc" x="640" y="40" width="200" height="66" rx="4"/>
  <text class="t" x="740" y="64" text-anchor="middle">spawn：全新上下文</text>
  <text class="s" x="740" y="84" text-anchor="middle">seed = 空</text>
  <rect class="proc" x="640" y="140" width="200" height="66" rx="4"/>
  <text class="t" x="740" y="164" text-anchor="middle">fork：继承父日志</text>
  <text class="s" x="740" y="184" text-anchor="middle">seed = 截到最后一个 turn/end</text>

  <rect class="bound" x="626" y="282" width="364" height="124" rx="10"/>
  <text class="s" x="640" y="300">虚线框 = 进程边界</text>
  <rect class="ext" x="640" y="310" width="200" height="82" rx="4"/>
  <rect class="ext" x="645" y="315" width="190" height="72" rx="3" style="fill:none"/>
  <text class="t" x="740" y="338" text-anchor="middle">外部 agent 产品</text>
  <text class="s" x="740" y="358" text-anchor="middle">Codex · Claude Code</text>
  <text class="s" x="740" y="375" text-anchor="middle">ACP · DSH SDK</text>

  <path class="edge" d="M530,222 C580,200 600,90 636,76" marker-end="url(#a)"/>
  <path class="edge" d="M530,240 C590,230 600,180 636,174" marker-end="url(#a)"/>
  <text class="e" x="540" y="128">② 本地：只交 seed 数据</text>
  <path class="edge" d="M530,300 C580,310 600,345 636,350" marker-end="url(#a)"/>
  <text class="e" x="545" y="432">② 外部：一次性 run</text>

  <!-- child stores -->
  <path class="store" d="M870,96 a55,12 0 0 1 110,0 v76 a55,12 0 0 1 -110,0 z"/>
  <path class="store" d="M870,96 a55,12 0 0 0 110,0" style="fill:none"/>
  <text class="t" x="925" y="132" text-anchor="middle">子会话日志</text>
  <text class="s" x="925" y="151" text-anchor="middle">可续聊</text>
  <path class="edge" d="M840,73 L866,104" marker-end="url(#a)"/>
  <path class="edge" d="M840,173 L866,158" marker-end="url(#a)"/>

  <rect class="ext" x="870" y="318" width="110" height="66" rx="4"/>
  <text class="t" x="925" y="344" text-anchor="middle">一次性线程</text>
  <text class="s" x="925" y="364" text-anchor="middle">不可续聊</text>
  <path class="edge" d="M840,351 H866" marker-end="url(#a)"/>

  <!-- agent team -->
  <rect class="orch" x="300" y="420" width="230" height="78" rx="4"/>
  <text class="t" x="415" y="446" text-anchor="middle">Agent Team（实验）</text>
  <text class="s" x="415" y="466" text-anchor="middle">roster / 任务 DAG 记在 Lead 日志</text>
  <text class="s" x="415" y="484" text-anchor="middle">成员 = 可续聊子 agent</text>
  <path class="edge" d="M415,420 V320" marker-end="url(#a)"/>
</svg>
