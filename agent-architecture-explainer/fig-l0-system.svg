<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t0 d0">
  <title id="t0">L0：DeepSeek Harness 的整体形状</title>
  <desc id="d0">主循环本身不保存对话。用户消息先进入持久化的收件箱，主循环认领后把事实追加到只追加的会话日志；每一步都从日志重新投影出模型请求，模型回复和工具结果也先落日志再进入下一步。虚线框内的每个方块都是可以从配置替换的 Cordis 插件。</desc>
  <style>
    .t{font:600 14px -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2328}
    .s{font:12px -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#57606a}
    .e{font:12px -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#424a53}
    .proc{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
    .hub{fill:#e0e7ff;stroke:#3730a3;stroke-width:3}
    .store{fill:#ecfdf5;stroke:#047857;stroke-width:1.8}
    .queue{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}
    .slot{stroke:#c2410c;stroke-width:1}
    .ext{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    .actor{fill:#fdf2f8;stroke:#be185d;stroke-width:1.5}
    .bound{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
    .edge{fill:none;stroke:#57606a;stroke-width:1.5}
    .back{fill:none;stroke:#047857;stroke-width:1.5;stroke-dasharray:5 4}
    .ah{fill:#57606a}.ahb{fill:#047857}
    @media (prefers-color-scheme: dark){
      .t{fill:#e6edf3}.s,.e{fill:#9da7b3}
      .proc{fill:#1e2448;stroke:#818cf8}.hub{fill:#272f5c;stroke:#a5b4fc}
      .store{fill:#0f2a22;stroke:#34d399}.queue{fill:#2f1d10;stroke:#fb923c}.slot{stroke:#fb923c}
      .ext{fill:#161b22;stroke:#8b949e}.actor{fill:#2d1424;stroke:#f472b6}
      .bound{stroke:#6e7681}.edge{stroke:#9da7b3}.back{stroke:#34d399}
      .ah{fill:#9da7b3}.ahb{fill:#34d399}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- plugin boundary -->
  <rect class="bound" x="168" y="14" width="626" height="526" rx="14"/>
  <text class="s" x="184" y="36">虚线框 = 一个 Cordis 进程：框内每个方块都是可从配置替换的插件</text>

  <!-- actor -->
  <rect class="actor" x="14" y="214" width="136" height="72" rx="36"/>
  <text class="t" x="82" y="246" text-anchor="middle">用户 / 宿主</text>
  <text class="s" x="82" y="266" text-anchor="middle">Web · CLI · SDK · ACP</text>

  <!-- inbox (queue) -->
  <rect class="queue" x="190" y="206" width="150" height="88" rx="6"/>
  <line class="slot" x1="300" y1="206" x2="300" y2="294"/><line class="slot" x1="320" y1="206" x2="320" y2="294"/>
  <text class="t" x="244" y="240" text-anchor="middle">收件箱</text>
  <text class="s" x="244" y="260" text-anchor="middle">next-turn</text>
  <text class="s" x="244" y="277" text-anchor="middle">next-step</text>

  <!-- assembler -->
  <rect class="proc" x="400" y="52" width="210" height="84" rx="4"/>
  <text class="t" x="505" y="84" text-anchor="middle">请求组装</text>
  <text class="s" x="505" y="104" text-anchor="middle">系统提示片段 · 本 agent 可见工具</text>
  <text class="s" x="505" y="121" text-anchor="middle">运行时上下文快照</text>

  <!-- hub loop -->
  <rect class="hub" x="400" y="200" width="210" height="100" rx="10"/>
  <text class="t" x="505" y="236" text-anchor="middle">主循环 Agent Loop</text>
  <text class="s" x="505" y="257" text-anchor="middle">turn → step → … → turn/end</text>
  <text class="s" x="505" y="276" text-anchor="middle">自己不保存对话</text>

  <!-- tools -->
  <rect class="proc" x="652" y="206" width="126" height="88" rx="4"/>
  <text class="t" x="715" y="238" text-anchor="middle">工具管线</text>
  <text class="s" x="715" y="258" text-anchor="middle">pre → execute</text>
  <text class="s" x="715" y="275" text-anchor="middle">→ post</text>

  <!-- session log (cylinder) -->
  <path class="store" d="M400,400 a105,16 0 0 1 210,0 v104 a105,16 0 0 1 -210,0 z"/>
  <path class="store" d="M400,400 a105,16 0 0 0 210,0" style="fill:none"/>
  <text class="t" x="505" y="446" text-anchor="middle">会话日志 Session Log</text>
  <text class="s" x="505" y="467" text-anchor="middle">只追加的事件序列</text>
  <text class="s" x="505" y="486" text-anchor="middle">唯一事实来源</text>

  <!-- external: model api -->
  <rect class="ext" x="826" y="52" width="160" height="84" rx="4"/>
  <rect class="ext" x="831" y="57" width="150" height="74" rx="3" style="fill:none"/>
  <text class="t" x="906" y="88" text-anchor="middle">模型 API</text>
  <text class="s" x="906" y="108" text-anchor="middle">DeepSeek 等</text>

  <!-- external: world -->
  <rect class="ext" x="826" y="206" width="160" height="88" rx="4"/>
  <rect class="ext" x="831" y="211" width="150" height="78" rx="3" style="fill:none"/>
  <text class="t" x="906" y="240" text-anchor="middle">外部世界</text>
  <text class="s" x="906" y="260" text-anchor="middle">文件 · Shell · MCP</text>
  <text class="s" x="906" y="277" text-anchor="middle">子 Agent</text>

  <!-- edges -->
  <path class="edge" d="M150,250 H186" marker-end="url(#a)"/>
  <text class="e" x="158" y="196">消息</text>
  <path class="edge" d="M340,250 H396" marker-end="url(#a)"/>
  <text class="e" x="346" y="240">认领</text>

  <path class="edge" d="M505,136 V196" marker-end="url(#a)"/>
  <text class="e" x="512" y="172">提示 + 工具 schema</text>

  <path class="edge" d="M470,300 V384" marker-end="url(#a)"/>
  <text class="e" x="300" y="346">① 追加事实</text>
  <text class="e" x="300" y="363">user / assistant / tool</text>
  <path class="back" d="M545,384 V304" marker-end="url(#b)"/>
  <text class="e" x="556" y="346">② 每步重新投影</text>
  <text class="e" x="556" y="363">deriveMessages()</text>

  <path class="edge" d="M610,222 C700,170 760,120 822,104" marker-end="url(#a)"/>
  <text class="e" x="660" y="150">③ 冻结的请求</text>
  <path class="edge" d="M822,124 C770,150 700,190 614,212" marker-end="url(#a)"/>
  <text class="e" x="684" y="196">④ 流式回复</text>

  <path class="edge" d="M610,270 H648" marker-end="url(#a)"/>
  <path class="edge" d="M778,250 H822" marker-end="url(#a)"/>
  <text class="e" x="652" y="318">⑤ 工具调用批次</text>
  <text class="e" x="652" y="335">审批 · 沙箱 · 截断</text>
</svg>
